<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1C202B"/>
            <stop offset="100%" stop-color="#12151D"/>
        </linearGradient>
        <linearGradient id="m_grad" x1="9" y1="10" x2="31" y2="31" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4F75FF"/>
            <stop offset="50%" stop-color="#00D2FF"/>
            <stop offset="100%" stop-color="#00E676"/>
        </linearGradient>
        <linearGradient id="s_grad" x1="12" y1="13" x2="27" y2="29" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#00E676"/>
        </linearGradient>
        <filter id="glow" x="4" y="4" width="32" height="32" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Badge Background -->
    <rect width="40" height="40" rx="9" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="39" height="39" rx="8.5" stroke="#2B3142" stroke-width="1"/>

    <!-- Subtle Glow behind curves -->
    <path d="M10 23V11.5C10 11.5 14 8.5 20 15C26 8.5 30 11.5 30 11.5V17M10 23C10 23 13 30.5 20 30.5C27 30.5 30 23 30 23V18M13 14C13 14 17 17.5 20 19.5C23.5 21.5 27 24 25.5 27.5C24 30.5 19 30.5 15.5 28.5"
          stroke="url(#m_grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>

    <!-- Outer 'M' & Lower Arch -->
    <path d="M10 21.5V11.5C10 11.5 14.2 8.8 20 14.8C25.8 8.8 30 11.5 30 11.5V17.5"
          stroke="url(#m_grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M10 22.5C10 22.5 12.5 30.5 20 30.5C27.5 30.5 30 22.5 30 22.5"
          stroke="url(#m_grad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Central 'S' Spine Flow -->
    <path d="M13 14.2C13.5 14 16.5 16.8 19.8 19.4C23.2 22 26.5 24.2 25.2 27.2C23.8 29.8 19.8 30.2 16.5 28.2"
          stroke="url(#s_grad)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Vector Bezier Handle Lines -->
    <line x1="7.5" y1="11.5" x2="13.5" y2="9.5" stroke="#486588" stroke-width="0.6" stroke-dasharray="1 1"/>
    <circle cx="7.5" cy="11.5" r="0.9" fill="#00D2FF"/>
    <circle cx="13.5" cy="9.5" r="0.9" fill="#00D2FF"/>

    <line x1="26.5" y1="9.5" x2="32.5" y2="11.5" stroke="#486588" stroke-width="0.6" stroke-dasharray="1 1"/>
    <circle cx="26.5" cy="9.5" r="0.9" fill="#00D2FF"/>
    <circle cx="32.5" cy="11.5" r="0.9" fill="#00D2FF"/>

    <!-- Vector Anchor Points (Nodes) -->
    <rect x="8.8" y="10.3" width="2.4" height="2.4" rx="0.5" fill="#E1F5FE" stroke="#12151D" stroke-width="0.5"/>
    <rect x="18.8" y="13.6" width="2.4" height="2.4" rx="0.5" fill="#E1F5FE" stroke="#12151D" stroke-width="0.5"/>
    <rect x="28.8" y="10.3" width="2.4" height="2.4" rx="0.5" fill="#E1F5FE" stroke="#12151D" stroke-width="0.5"/>
    <rect x="8.8" y="21.3" width="2.4" height="2.4" rx="0.5" fill="#B9F6CA" stroke="#12151D" stroke-width="0.5"/>
    <rect x="28.8" y="21.3" width="2.4" height="2.4" rx="0.5" fill="#B9F6CA" stroke="#12151D" stroke-width="0.5"/>
    <rect x="18.8" y="29.3" width="2.4" height="2.4" rx="0.5" fill="#B9F6CA" stroke="#12151D" stroke-width="0.5"/>
</svg>